<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .cup { fill: #FFC94D; stroke: #08285F; stroke-width: 3; stroke-linejoin: round; }
      .arm { fill: none; stroke: #08285F; stroke-width: 3.5; stroke-linecap: round; }
      .frame { fill: none; stroke: #08285F; stroke-width: 2.5; stroke-linecap: round; }
      .steam { fill: none; stroke: #8FC7F5; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- coffee cup -->
  <path class="cup" d="M20 26 h24 a3 3 0 0 1 3 3 v8 a13 13 0 0 1 -13 13 h-4 a13 13 0 0 1 -13 -13 v-8 a3 3 0 0 1 3 -3 z"/>
  <!-- handle -->
  <path class="arm" d="M44 29 h5 a4.5 4.5 0 0 1 0 9 h-5"/>

  <!-- robot arm above-left: shoulder -> elbow -> gripper reaching for cup -->
  <path class="arm" d="M9 4 v10 M9 14 l3 6"/>
  <!-- elbow joint -->
  <circle cx="9" cy="14" r="2.5" fill="#08285F"/>
  <!-- gripper hovering just above the cup rim -->
  <path class="frame" d="M10 22 v-2 M10 22 a2 2 0 0 1 2 2 M10 22 a2 2 0 0 0 -2 2"/>

  <!-- steam -->
  <path class="steam" d="M25 22 q-2 -4 2 -6 M31 22 q-2 -4 2 -6"/>
</svg>